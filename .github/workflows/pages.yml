name: Publish COP feeds to Pages

on:
  push:
    branches: [main]
    paths:
      - "site/public/**"
      - "docs/pages-index.html"
      - "docs/screenshots/**"
      - "docs/qr-live-demo.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the feeds behind an index page
        run: |
          mkdir -p _pages/assets
          cp -r site/public/* _pages/
          cp docs/pages-index.html _pages/index.html
          cp docs/screenshots/map-only-april.png docs/qr-live-demo.png _pages/assets/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - id: deployment
        uses: actions/deploy-pages@v4
